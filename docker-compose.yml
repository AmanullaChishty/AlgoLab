services:
  postgres:
    image: postgres:16
    container_name: algolab-postgres

    environment:
      POSTGRES_DB: algolab
      POSTGRES_USER: algolab
      POSTGRES_PASSWORD: algolab_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: